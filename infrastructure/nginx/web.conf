server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cabeçalhos de segurança (seção 13.1). A CSP é restritiva por padrão:
    # ao adicionar CDN, fonte externa ou telemetria, ajustar aqui de forma explícita.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # HSTS só faz sentido atrás de TLS; habilitar no proxy de produção
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # assets versionados pelo Vite podem ser cacheados agressivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index nunca é cacheado: garante que o deploy novo chegue ao navegador
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://api:8000/health/;
        access_log off;
    }

    # SPA: qualquer rota desconhecida cai no index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
