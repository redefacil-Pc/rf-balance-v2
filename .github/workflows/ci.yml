name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-quality:
    name: backend — lint, tipos e unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check app ../worker tests
      - name: format
        run: ruff format --check app ../worker tests
      - name: mypy
        run: mypy app
      - name: pytest unit
        # Baseline global atual; subir gradualmente ate 70% conforme as camadas
        # de aplicacao e infraestrutura ganharem testes unitarios dedicados.
        run: pytest tests/unit --cov=app --cov-report=term-missing --cov-fail-under=20

  backend-integration:
    name: backend — integração (MySQL e Redis efêmeros)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: rfbalance_test
          MYSQL_USER: rfbalance
          MYSQL_PASSWORD: rfbalance
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+asyncmy://rfbalance:rfbalance@127.0.0.1:3306/rfbalance_test
      TEST_MIGRATION_DATABASE_URL: mysql+asyncmy://root:ci@127.0.0.1:3306/rfbalance_test
      DATABASE_URL: mysql+asyncmy://rfbalance:rfbalance@127.0.0.1:3306/rfbalance_test
      MIGRATION_DATABASE_URL: mysql+asyncmy://root:ci@127.0.0.1:3306/rfbalance_test
      REDIS_URL: redis://127.0.0.1:6379/9
      SECRET_KEY: ci-secret-key-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: migrations — upgrade e downgrade em banco vazio
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: pytest integração
        run: pytest tests/integration

  backend-performance:
    name: backend — orçamento p95 no volume de três anos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: rfbalance_test
          MYSQL_USER: rfbalance
          MYSQL_PASSWORD: rfbalance
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: mysql+asyncmy://rfbalance:rfbalance@127.0.0.1:3306/rfbalance_test
      MIGRATION_DATABASE_URL: mysql+asyncmy://root:ci@127.0.0.1:3306/rfbalance_test
      REDIS_URL: redis://127.0.0.1:6379/8
      SECRET_KEY: performance-secret-key-com-mais-de-32-caracteres
      SEED_ADMIN_PASSWORD: performance-ci-password-2026
      PERFORMANCE_DASHBOARD_P95_SECONDS: "2.0"
      PERFORMANCE_REPORT_P95_SECONDS: "5.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: massa sintética — três anos e 20 mil propostas
        run: python -m app.platform.db.seed_volumetric --proposals 20000 --reset
      - name: orçamento de dashboard e relatório
        run: pytest tests/performance -s

  contract:
    name: contrato — OpenAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      SECRET_KEY: ci-secret-key-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: gerar openapi.json
        run: |
          python -c "import json;from app.main import criar_app;print(json.dumps(criar_app().openapi(),indent=2))" > openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

  frontend:
    name: frontend — tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  frontend-e2e:
    name: frontend — fluxo crítico no navegador
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: preparar configuração local sintética
        run: cp ../../.env.example ../../.env
      - name: subir dependências do E2E
        run: docker compose -f ../../infrastructure/compose/docker-compose.yml --env-file ../../.env --profile local-storage up -d db redis minio minio-init
      - name: executar Playwright
        run: npm run test:e2e
      - name: publicar diagnóstico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - name: encerrar ambiente
        if: always()
        run: docker compose -f ../../infrastructure/compose/docker-compose.yml --env-file ../../.env --profile local-storage down -v

  security:
    name: segurança — dependências e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r <(python -c "
          import tomllib
          with open('apps/api/pyproject.toml','rb') as fh: d=tomllib.load(fh)
          print('\n'.join(d['project']['dependencies']))
          ")
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit do lockfile versionado
        working-directory: apps/web
        run: npm ci && npm audit --audit-level=moderate
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: imagens — build e scan
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          load: true
          tags: rfbalance/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: false
          load: true
          tags: rfbalance/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan api
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rfbalance/api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: scan web
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rfbalance/web:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
