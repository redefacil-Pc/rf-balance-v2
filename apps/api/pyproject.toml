[project]
name = "rfbalance-api"
version = "0.1.0"
description = "RF Balance v2 — API modular"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<1.15",
    "asyncmy>=0.2.9,<0.3",
    # exigido pelo caching_sha2_password, autenticação padrão do MySQL 8.4
    "cryptography>=43,<45",
    "redis>=5.2,<6",
    "argon2-cffi>=23.1,<26",
    "structlog>=24.4,<25",
    "boto3>=1.35,<2",
    # exigido pelo FastAPI para `UploadFile` (upload de comprovante)
    "python-multipart>=0.0.12,<0.1",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "httpx>=0.27,<0.28",
    # sobe o lifespan da aplicação nos testes de integração
    "asgi-lifespan>=2.1,<3",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncmy.*", "boto3.*", "botocore.*", "openpyxl.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: exige MySQL e Redis",
    "performance: mede orçamento p95",
]
